name: Cross-platform Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  macos-release:
    name: macOS ${{ matrix.arch }} Lite and Bundle
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            artifact: metis-macos-arm64-release
          - arch: x64
            runner: macos-15-intel
            artifact: metis-macos-x64-release
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate-base: true

      - name: Install npm dependencies
        run: npm ci

      - name: Run release guard tests
        run: |
          npm run typecheck
          node tests/crossPlatformRuntimeStatic.test.mjs
          node tests/productionReleaseStatic.test.mjs
          node tests/crossPlatformReleaseWorkflow.test.mjs
          node tests/installerSetupTheme.test.mjs

      - name: Build macOS Lite
        run: npm run build:lite:mac

      - name: Build bundled macOS R runtime
        env:
          R_ARCHIVE: R-macos.tar.gz
          GITHUB_PAT: ${{ github.token }}
          DOWNLOAD_STATIC_LIBV8: "1"
        run: |
          conda create -y -p "$PWD/R-Bundled" -c conda-forge \
            r-base r-jsonlite r-matrix r-readxl r-remotes conda-pack \
            c-compiler cxx-compiler fortran-compiler make pkg-config \
            abseil-cpp udunits2 libuv libsodium zlib libxml2
          conda activate "$PWD/R-Bundled"
          "$PWD/R-Bundled/bin/Rscript" scripts/install-required-r-packages.R
          "$PWD/R-Bundled/bin/conda-pack" -p "$PWD/R-Bundled" -o "r-api/$R_ARCHIVE" --arcroot R-Bundled

      - name: Verify macOS bundled R runtime
        run: |
          node scripts/verify-r-bundle-archive.mjs darwin
          node scripts/smoke-r-bundle-runtime.mjs darwin

      - name: Build macOS Bundle
        run: npm run build:bundle:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/lite/*.dmg
            release/lite/*.zip
            release/bundle/*.dmg
            release/bundle/*.zip
            r-api/R-macos.tar.gz
